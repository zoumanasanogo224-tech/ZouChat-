name: Build ZouChat Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(grep "versionName" android/app/build.gradle | cut -d "\x27" -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZouChat-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.app_version.outputs.version }}
          name: ZouChat Android v${{ steps.app_version.outputs.version }}
          body: |
            APK Android de ZouChat.

            Cette version charge l'application web publiée sur GitHub Pages. Les mises à jour du site sont donc visibles en ligne sans réinstaller l'APK. Les modifications natives nécessitent une nouvelle version de l'APK.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
