name: ZouChat code validation

on:
  push:
    branches: [main, fix/zouchat-audit-2026-10-24]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          scripts = [script for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit("FAIL: no inline JavaScript found")
          Path("/tmp/zouchat-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          print(f"Checking {len(scripts)} inline script(s)")
          PY
          node --check /tmp/zouchat-inline.js
      - name: Verify the Guardian request function remains asynchronous
        run: |
          grep -Fq 'async function guardianRequest(action,extra={})' index.html
          echo "Guardian request helper declaration verified"
      - name: Check that private keys are not committed
        run: |
          if grep -RInE 'sk-[A-Za-z0-9_-]{20,}|service_role.{0,20}[A-Za-z0-9_-]{30,}' --exclude-dir=.git --exclude='*.md' .; then
            echo "Possible private key found. Remove it and rotate the key."
            exit 1
          fi
  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Guardian Edge Function
        run: deno check supabase/functions/zouchat-ai-guardian/index.ts
