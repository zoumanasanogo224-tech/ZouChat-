plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.zouchat.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.zouchat.app'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '1.0.13'
    }

    // Android utilise automatiquement la clé debug standard pour assembleDebug.
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
}
